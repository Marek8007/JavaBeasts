spring.application.name=JavaBeasts-Backend

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:33006}/${DB_NAME:JavaBeasts}${DB_URL_OPTIONS:?sslMode=DISABLED}
spring.datasource.username=${DB_USERNAME:dbuser}
spring.datasource.password=${DB_PASSWORD:dbpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.port=8081
app.db.test-on-startup=false
